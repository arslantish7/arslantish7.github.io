<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Arslan Ghani</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="error-page" id="main">
    <div>
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">AG</span>
        <span class="brand-name">Arslan Ghani</span>
      </a>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="section-title">This page doesn't exist</h1>
      <p class="section-intro">The link may be broken or the page may have moved. Head back to the homepage to see my work.</p>
      <a class="btn btn-primary btn-lg" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Back to homepage
      </a>
    </div>
  </main>
</body>
</html>
