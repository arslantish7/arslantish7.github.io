    <path d="M101 111l9 4.5-9 4.5-9-4.5z M95 118v4c3 2.5 9 2.5 12 0v-4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="122" y="113" width="64" height="9" rx="4.5" fill="#334155"/>
    <rect x="84" y="150" width="122" height="30" rx="8" fill="#ccfbf1"/>
