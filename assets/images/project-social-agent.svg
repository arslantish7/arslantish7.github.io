<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-100%" width="180%" height="400%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <clipPath id="win"><rect x="70" y="60" width="660" height="400" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <rect x="70" y="60" width="660" height="400" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <!-- Title bar -->
    <rect x="70" y="60" width="660" height="34" fill="#f1f5f9"/>
    <circle cx="92" cy="77" r="5" fill="#ff5f57"/>
    <circle cx="109" cy="77" r="5" fill="#febc2e"/>
    <circle cx="126" cy="77" r="5" fill="#28c840"/>
    <text x="400" y="81" text-anchor="middle" font-size="12" fill="#64748b">Social Media Agent</text>

    <!-- Sidebar -->
    <rect x="70" y="94" width="150" height="366" fill="#0f172a"/>
    <rect x="88" y="112" width="26" height="26" rx="7" fill="#14b8a6"/>
    <path d="M101 117l1.9 4.6 4.6 1.9-4.6 1.9-1.9 4.6-1.9-4.6-4.6-1.9 4.6-1.9z" fill="#ffffff"/>
    <rect x="122" y="120" width="64" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="84" y="160" width="122" height="30" rx="8" fill="#14b8a6" fill-opacity="0.18"/>
    <rect x="96" y="170" width="10" height="10" rx="3" fill="#2dd4bf"/>
    <rect x="114" y="171" width="58" height="8" rx="4" fill="#5eead4"/>
    <rect x="96" y="209" width="10" height="10" rx="3" fill="#475569"/>
    <rect x="114" y="210" width="50" height="8" rx="4" fill="#475569"/>
    <rect x="96" y="243" width="10" height="10" rx="3" fill="#475569"/>
    <rect x="114" y="244" width="66" height="8" rx="4" fill="#475569"/>
    <rect x="96" y="277" width="10" height="10" rx="3" fill="#475569"/>
    <rect x="114" y="278" width="42" height="8" rx="4" fill="#475569"/>
    <rect x="84" y="404" width="122" height="40" rx="10" fill="#1e293b"/>
    <circle cx="104" cy="424" r="10" fill="#818cf8"/>
    <rect x="120" y="420" width="60" height="8" rx="4" fill="#94a3b8"/>

    <!-- Header -->
    <text x="240" y="130" font-size="18" font-weight="700" fill="#0f172a">Overview</text>
    <rect x="240" y="140" width="120" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="608" y="112" width="102" height="30" rx="8" fill="#0f766e"/>
    <text x="659" y="131.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">+ New post</text>

    <!-- KPI cards -->
    <rect x="240" y="162" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="254" y="184" font-size="11" fill="#64748b">Followers</text>
    <text x="254" y="216" font-size="22" font-weight="700" fill="#0f172a">12.4k</text>
    <text x="372" y="216" text-anchor="end" font-size="11" font-weight="600" fill="#0f766e">▲ 8%</text>

    <rect x="402" y="162" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="416" y="184" font-size="11" fill="#64748b">Engagement</text>
    <text x="416" y="216" font-size="22" font-weight="700" fill="#0f172a">6.8%</text>
    <text x="534" y="216" text-anchor="end" font-size="11" font-weight="600" fill="#0f766e">▲ 1.2</text>

    <rect x="564" y="162" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="578" y="184" font-size="11" fill="#64748b">Scheduled</text>
    <text x="578" y="216" font-size="22" font-weight="700" fill="#0f172a">24</text>
    <text x="696" y="216" text-anchor="end" font-size="11" font-weight="600" fill="#6366f1">posts</text>

    <!-- Engagement chart -->
    <rect x="240" y="250" width="300" height="194" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="256" y="275" font-size="13" font-weight="600" fill="#0f172a">Engagement</text>
    <rect x="468" y="262" width="58" height="18" rx="9" fill="#ccfbf1"/>
    <text x="497" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">7 days</text>
    <g stroke="#f1f5f9" stroke-width="1.5">
      <line x1="256" y1="312" x2="524" y2="312"/>
      <line x1="256" y1="352" x2="524" y2="352"/>
      <line x1="256" y1="392" x2="524" y2="392"/>
    </g>
    <path d="M256 406C290 398 306 366 336 372S384 340 414 346S470 308 520 302L520 430L256 430Z" fill="url(#area)"/>
    <path d="M256 406C290 398 306 366 336 372S384 340 414 346S470 308 520 302" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="520" cy="302" r="5" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>

    <!-- Post queue -->
    <rect x="556" y="250" width="154" height="194" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="572" y="275" font-size="13" font-weight="600" fill="#0f172a">Post queue</text>
    <circle cx="583" cy="308" r="11" fill="#818cf8"/>
    <rect x="601" y="300" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="601" y="312" width="52" height="6" rx="3" fill="#e2e8f0"/>
    <circle cx="583" cy="352" r="11" fill="#14b8a6"/>
    <rect x="601" y="344" width="70" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="601" y="356" width="60" height="6" rx="3" fill="#e2e8f0"/>
    <circle cx="583" cy="396" r="11" fill="#f59e0b"/>
    <rect x="601" y="388" width="84" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="601" y="400" width="44" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Floating AI badge -->
  <rect x="556" y="30" width="186" height="40" rx="20" fill="#0f172a" filter="url(#badgeShadow)"/>
  <path d="M582 40l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#2dd4bf"/>
  <text x="598" y="55" font-size="13" font-weight="600" fill="#e2e8f0">AI suggestions on</text>
</svg>
