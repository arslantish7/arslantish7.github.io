<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="img1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="img2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="img3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <symbol id="house" viewBox="0 0 40 32">
      <path d="M20 2 38 16h-5v14H24v-9h-8v9H7V16H2z" fill="#ffffff" fill-opacity="0.92"/>
    </symbol>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win"><rect x="70" y="50" width="660" height="410" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <rect x="70" y="50" width="660" height="410" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <!-- Browser bar -->
    <rect x="70" y="50" width="660" height="38" fill="#f1f5f9"/>
    <circle cx="92" cy="69" r="5" fill="#ff5f57"/>
    <circle cx="109" cy="69" r="5" fill="#febc2e"/>
    <circle cx="126" cy="69" r="5" fill="#28c840"/>
    <rect x="200" y="59" width="400" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="400" y="73" text-anchor="middle" font-size="11" fill="#64748b">rental-platform / listings</text>

    <!-- Site nav -->
    <rect x="96" y="104" width="22" height="22" rx="6" fill="#0f766e"/>
    <use href="#house" xlink:href="#house" x="100" y="109" width="14" height="12"/>
    <text x="126" y="120" font-size="14" font-weight="700" fill="#0f172a">Rentals</text>
    <rect x="430" y="111" width="44" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="490" y="111" width="52" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="558" y="111" width="40" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="620" y="102" width="84" height="26" rx="13" fill="#0f172a"/>
    <text x="662" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">List property</text>

    <!-- Search -->
    <text x="96" y="168" font-size="21" font-weight="700" fill="#0f172a">Find your next home</text>
    <rect x="96" y="184" width="608" height="46" rx="23" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M124 196c-4.4 0-8 3.4-8 7.7 0 5.6 8 12.3 8 12.3s8-6.7 8-12.3c0-4.3-3.6-7.7-8-7.7z" fill="#0f766e"/>
    <circle cx="124" cy="203.5" r="2.8" fill="#ffffff"/>
    <text x="142" y="212" font-size="13" fill="#0f172a">Lahore, Pakistan</text>
    <line x1="300" y1="196" x2="300" y2="218" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="318" y="212" font-size="13" fill="#64748b">Any type</text>
    <line x1="440" y1="196" x2="440" y2="218" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="458" y="212" font-size="13" fill="#64748b">Budget</text>
    <rect x="604" y="191" width="92" height="32" rx="16" fill="#0f766e"/>
    <text x="650" y="211.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Search</text>

    <!-- Filter chips -->
    <rect x="96" y="246" width="66" height="24" rx="12" fill="#0f766e"/>
    <text x="129" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Houses</text>
    <rect x="170" y="246" width="62" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="201" y="262" text-anchor="middle" font-size="11" fill="#475569">Rooms</text>
    <rect x="240" y="246" width="54" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="267" y="262" text-anchor="middle" font-size="11" fill="#475569">Flats</text>

    <!-- Listing cards -->
    <g>
      <rect x="96" y="286" width="192" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M96 298a12 12 0 0 1 12-12h168a12 12 0 0 1 12 12v68H96z" fill="url(#img1)"/>
      <use href="#house" xlink:href="#house" x="172" y="306" width="40" height="32"/>
      <rect x="106" y="296" width="58" height="18" rx="9" fill="#ffffff"/>
      <text x="135" y="309" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">Verified</text>
      <text x="108" y="388" font-size="13" font-weight="700" fill="#0f172a">Rs 45,000<tspan font-size="10" font-weight="400" fill="#64748b"> /month</tspan></text>
      <rect x="108" y="398" width="130" height="7" rx="3.5" fill="#cbd5e1"/>
      <text x="108" y="428" font-size="10" fill="#64748b">3 beds · 2 baths · Johar Town</text>
    </g>
    <g>
      <rect x="304" y="286" width="192" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M304 298a12 12 0 0 1 12-12h168a12 12 0 0 1 12 12v68H304z" fill="url(#img2)"/>
      <use href="#house" xlink:href="#house" x="380" y="306" width="40" height="32"/>
      <text x="316" y="388" font-size="13" font-weight="700" fill="#0f172a">Rs 18,000<tspan font-size="10" font-weight="400" fill="#64748b"> /month</tspan></text>
      <rect x="316" y="398" width="110" height="7" rx="3.5" fill="#cbd5e1"/>
      <text x="316" y="428" font-size="10" fill="#64748b">1 room · Shared kitchen</text>
    </g>
    <g>
      <rect x="512" y="286" width="192" height="158" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M512 298a12 12 0 0 1 12-12h168a12 12 0 0 1 12 12v68H512z" fill="url(#img3)"/>
      <use href="#house" xlink:href="#house" x="588" y="306" width="40" height="32"/>
      <text x="524" y="388" font-size="13" font-weight="700" fill="#0f172a">Rs 32,000<tspan font-size="10" font-weight="400" fill="#64748b"> /month</tspan></text>
      <rect x="524" y="398" width="124" height="7" rx="3.5" fill="#cbd5e1"/>
      <text x="524" y="428" font-size="10" fill="#64748b">2 beds · 1 bath · Flat</text>
    </g>
  </g>
</svg>
