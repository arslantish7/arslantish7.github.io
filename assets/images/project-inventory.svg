<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win"><rect x="70" y="50" width="660" height="410" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <rect x="70" y="50" width="660" height="410" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <!-- Title bar -->
    <rect x="70" y="50" width="660" height="36" fill="#f1f5f9"/>
    <circle cx="92" cy="68" r="5" fill="#ff5f57"/>
    <circle cx="109" cy="68" r="5" fill="#febc2e"/>
    <circle cx="126" cy="68" r="5" fill="#28c840"/>
    <text x="400" y="72" text-anchor="middle" font-size="12" fill="#64748b">Inventory Manager</text>

    <!-- Toolbar -->
    <text x="96" y="120" font-size="18" font-weight="700" fill="#0f172a">Stock overview</text>
    <rect x="96" y="130" width="96" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="512" y="102" width="82" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="553" y="121.5" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Export</text>
    <rect x="604" y="102" width="100" height="30" rx="8" fill="#0f766e"/>
    <text x="654" y="121.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">+ Add item</text>

    <!-- KPI cards -->
    <rect x="96" y="152" width="192" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="112" y="174" font-size="11" fill="#64748b">Total items</text>
    <text x="112" y="202" font-size="21" font-weight="700" fill="#0f172a">1,248</text>
    <rect x="304" y="152" width="192" height="64" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="320" y="174" font-size="11" fill="#92400e">Low stock</text>
    <text x="320" y="202" font-size="21" font-weight="700" fill="#b45309">12</text>
    <circle cx="474" cy="172" r="5" fill="#f59e0b"/>
    <rect x="512" y="152" width="192" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="528" y="174" font-size="11" fill="#64748b">Reports this month</text>
    <text x="528" y="202" font-size="21" font-weight="700" fill="#0f172a">8</text>

    <!-- Table -->
    <rect x="96" y="232" width="400" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M96 242a10 10 0 0 1 10-10h380a10 10 0 0 1 10 10v20H96z" fill="#f8fafc"/>
    <g font-size="10" font-weight="600" fill="#64748b">
      <text x="112" y="251">ITEM</text>
      <text x="250" y="251">SKU</text>
      <text x="336" y="251">QTY</text>
      <text x="400" y="251">STATUS</text>
    </g>
    <g stroke="#f1f5f9">
      <line x1="96" y1="262" x2="496" y2="262"/>
      <line x1="96" y1="298" x2="496" y2="298"/>
      <line x1="96" y1="334" x2="496" y2="334"/>
      <line x1="96" y1="370" x2="496" y2="370"/>
      <line x1="96" y1="406" x2="496" y2="406"/>
    </g>
    <g font-size="11" fill="#334155">
      <rect x="112" y="271" width="18" height="18" rx="5" fill="#ccfbf1"/>
      <rect x="138" y="276" width="76" height="8" rx="4" fill="#94a3b8"/>
      <text x="250" y="284" font-family="Consolas, monospace">SKU-1042</text>
      <text x="336" y="284">320</text>
      <rect x="400" y="272" width="62" height="16" rx="8" fill="#ccfbf1"/>
      <text x="431" y="284" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">In stock</text>

      <rect x="112" y="307" width="18" height="18" rx="5" fill="#e0f2fe"/>
      <rect x="138" y="312" width="64" height="8" rx="4" fill="#94a3b8"/>
      <text x="250" y="320" font-family="Consolas, monospace">SKU-2207</text>
      <text x="336" y="320">14</text>
      <rect x="400" y="308" width="62" height="16" rx="8" fill="#fef3c7"/>
      <text x="431" y="320" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b45309">Low</text>

      <rect x="112" y="343" width="18" height="18" rx="5" fill="#ede9fe"/>
      <rect x="138" y="348" width="84" height="8" rx="4" fill="#94a3b8"/>
      <text x="250" y="356" font-family="Consolas, monospace">SKU-3318</text>
      <text x="336" y="356">156</text>
      <rect x="400" y="344" width="62" height="16" rx="8" fill="#ccfbf1"/>
      <text x="431" y="356" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">In stock</text>

      <rect x="112" y="379" width="18" height="18" rx="5" fill="#fee2e2"/>
      <rect x="138" y="384" width="58" height="8" rx="4" fill="#94a3b8"/>
      <text x="250" y="392" font-family="Consolas, monospace">SKU-4051</text>
      <text x="336" y="392">0</text>
      <rect x="400" y="380" width="62" height="16" rx="8" fill="#fee2e2"/>
      <text x="431" y="392" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b91c1c">Out</text>

      <rect x="112" y="415" width="18" height="18" rx="5" fill="#ccfbf1"/>
      <rect x="138" y="420" width="70" height="8" rx="4" fill="#94a3b8"/>
      <text x="250" y="428" font-family="Consolas, monospace">SKU-5126</text>
      <text x="336" y="428">88</text>
      <rect x="400" y="416" width="62" height="16" rx="8" fill="#ccfbf1"/>
      <text x="431" y="428" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">In stock</text>
    </g>

    <!-- Stock level chart -->
    <rect x="512" y="232" width="192" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="528" y="256" font-size="13" font-weight="600" fill="#0f172a">Stock levels</text>
    <line x1="528" y1="424" x2="688" y2="424" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="534" y="320" width="16" height="104" rx="4" fill="#14b8a6"/>
    <rect x="560" y="290" width="16" height="134" rx="4" fill="#14b8a6"/>
    <rect x="586" y="398" width="16" height="26" rx="4" fill="#f59e0b"/>
    <rect x="612" y="340" width="16" height="84" rx="4" fill="#14b8a6"/>
    <rect x="638" y="306" width="16" height="118" rx="4" fill="#0f766e"/>
    <rect x="664" y="360" width="16" height="64" rx="4" fill="#14b8a6"/>
  </g>
</svg>
